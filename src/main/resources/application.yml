spring:
  application:
    name: marmoraria-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/marmoraria}
    username: ${DB_USER:app_user}
    password: ${DB_PASSWORD:}
    hikari:
      auto-commit: false
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    properties:
      hibernate:
        connection:
          provider_disables_autocommit: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URL:}

server:
  port: ${PORT:8080}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

billing:
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    success-url: ${STRIPE_SUCCESS_URL:}
    cancel-url: ${STRIPE_CANCEL_URL:}
    prices:
      basico: ${STRIPE_PRICE_BASICO:}
      pro: ${STRIPE_PRICE_PRO:}
